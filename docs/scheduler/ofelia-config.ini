; RECORD COPY. The live file is d:/infrastructure/ofelia/config.ini on the company server;
; this is only the Curing Dashboard part of it. Change the live file, then update this copy.
; The script next to this file is a copy of d:/infrastructure/ofelia/scripts/api/curing-job.sh.
; Curing Dashboard (hosted on Vercel, database on Neon) — called over the internet.
; Endpoint: app/api/jobs/[job]/route.ts (curing-dashboard). One script, the job name as parameter.
;
; sync  every hour at :05 — Curing Sheet + Sioplas drum sheet -> dashboard, then the
;       rules, which queue the WhatsApp alerts. Safe to re-run: unchanged rows are skipped.
; w3    every hour at :35 — "Curing Log not updated" watch, after the sync has settled.
; w7    08:15 IST daily — MD summary (the job itself sends at most one a day).
;
; ofelia uses a 6-field cron: sec min hour dom mon dow (container timezone, IST).
; job-local runs inside the ofelia container; -T 300 in the script matches the
; route's maxDuration (a sync takes about 50 s).
[job-local "curing-sync"]
schedule = 0 5 * * * *
command = sh /scripts/api/curing-job.sh sync
no-overlap = true

[job-local "curing-log-watch"]
schedule = 0 35 * * * *
command = sh /scripts/api/curing-job.sh w3
no-overlap = true

[job-local "curing-md-summary"]
schedule = 0 15 8 * * *
command = sh /scripts/api/curing-job.sh w7
no-overlap = true
